version: '3.9'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: pwd_db
      POSTGRES_USER: pwd_user
      POSTGRES_PASSWORD: pwd_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    restart: always
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    volumes:
      - ./backend:/app
      - media_files:/app/media
      - static_files:/app/staticfiles
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=change-this-in-production
      - DEBUG=False
      - DB_NAME=pwd_db
      - DB_USER=pwd_user
      - DB_PASSWORD=pwd_password
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CORS_ALLOWED_ORIGINS=http://localhost,http://your-domain.com
    depends_on:
      - db
      - redis

  celery:
    build: ./backend
    restart: always
    command: celery -A config worker --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      - SECRET_KEY=change-this-in-production
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  celery-beat:
    build: ./backend
    restart: always
    command: celery -A config beat --loglevel=info
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  media_files:
  static_files:
