services:
  # ─────────────────────────────────────────────
  # Django Backend API
  # ─────────────────────────────────────────────
  - type: web
    name: pwd-management-backend
    runtime: python
    plan: free
    rootDir: backend

    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate

    startCommand: gunicorn config.wsgi:application

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3

      - key: DEBUG
        value: false

      - key: SECRET_KEY
        generateValue: true

      - key: ALLOWED_HOSTS
        value: .onrender.com

      - key: DATABASE_URL
        fromDatabase:
          name: pwd-management-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: redis
          name: pwd-management-redis
          property: connectionString

      - key: CORS_ALLOWED_ORIGINS
        value: https://pwd-management-frontend.onrender.com

      - key: CSRF_TRUSTED_ORIGINS
        value: https://pwd-management-frontend.onrender.com

      - key: WEB_CONCURRENCY
        value: 4

    autoDeploy: true

  # ─────────────────────────────────────────────
  # Vue/Vite Frontend
  # ─────────────────────────────────────────────
  - type: web
    name: pwd-management-frontend
    runtime: static
    rootDir: frontend

    buildCommand: |
      npm install
      npm run build

    staticPublishPath: dist

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: VITE_API_BASE_URL
        value: https://pwd-management-backend.onrender.com

    autoDeploy: true

  # ─────────────────────────────────────────────
  # Celery Worker
  # ─────────────────────────────────────────────
  - type: worker
    name: pwd-management-worker
    runtime: python
    plan: free
    rootDir: backend

    buildCommand: |
      pip install -r requirements.txt

    startCommand: celery -A config worker -l info

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pwd-management-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: redis
          name: pwd-management-redis
          property: connectionString

      - key: SECRET_KEY
        sync: false

      - key: DEBUG
        value: false

    autoDeploy: true

databases:
  # ─────────────────────────────────────────────
  # PostgreSQL Database
  # ─────────────────────────────────────────────
  - name: pwd-management-db
    databaseName: pwd_management
    plan: free

redis:
  # ─────────────────────────────────────────────
  # Redis
  # ─────────────────────────────────────────────
  - name: pwd-management-redis
    plan: free
    ipAllowList: []